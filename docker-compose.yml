services:
  livestream-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livestream-manager
    restart: always
    network_mode: host
    extra_hosts:
      - "livestream-manager:127.0.0.1"
    volumes:
      - ./data:/app/data
      - /mnt/data/Projects/Beamer/FreeShow:/mnt/data/Projects/Beamer/FreeShow
      - /mnt/data/Projects/Beamer/FreeShow/Media:/app/public/thumbnails
    environment:
      - NODE_ENV=production
      - PORT=3005
      - HOSTNAME=0.0.0.0


  companion:
    image: companion-nas-v4-3-4:latest
    container_name: companion
    restart: always
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./companion-data:/companion
    networks:
      - ark-net

  qlcplus:
    build:
      context: .
      dockerfile: config/qlcplus/Dockerfile
    container_name: qlcplus
    restart: always
    network_mode: host
    volumes:
      - ./config/ark_church_lighting.qxw:/QLC/ark_church_lighting.qxw
      - ./config/qlcplus/config:/root/.config/qlcplus

  x32-emulator:
    build:
      context: ./config/emulators/x32-emulator
      dockerfile: Dockerfile
    container_name: x32-emulator
    restart: always
    ports:
      - "10023:10023/udp"
    networks:
      - ark-net

  atem-emulator:
    build:
      context: ./config/emulators/atem-emulator
      dockerfile: Dockerfile
    container_name: atem-emulator
    restart: always
    ports:
      - "9910:9910/udp"
    environment:
      - PYTHONUNBUFFERED=1
      - ATEM_MODEL=ATEM Mini Pro
    networks:
      - ark-net

networks:
  ark-net:
    driver: bridge
