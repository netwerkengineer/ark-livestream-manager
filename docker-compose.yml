services:
  livestream-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livestream-manager
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - /volume1/Beamer/FreeShow/Media:/app/public/thumbnails
    environment:
      - NODE_ENV=production
      # De rest van de instellingen gaan via de Setup Wizard in de browser!
