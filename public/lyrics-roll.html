<!doctype html>
<meta charset="utf-8">
<title>Lyrics roll</title>
<style>
  /* Montserrat Bold (SIL OFL, @fontsource/montserrat 5.2.5), door de app zelf geleverd: de beamer-pc heeft het lettertype niet geïnstalleerd en viel terug op Arial */
  @font-face { font-family: 'Ark Montserrat'; font-style: normal; font-weight: 700; font-display: block; src: url('/fonts/montserrat/montserrat-latin-700-normal.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: 'Ark Montserrat'; font-style: italic; font-weight: 700; font-display: block; src: url('/fonts/montserrat/montserrat-latin-700-italic.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: 'Ark Montserrat'; font-style: normal; font-weight: 700; font-display: block; src: url('/fonts/montserrat/montserrat-latin-ext-700-normal.woff2') format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family: 'Ark Montserrat'; font-style: italic; font-weight: 700; font-display: block; src: url('/fonts/montserrat/montserrat-latin-ext-700-italic.woff2') format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: 'Ark Montserrat', CMGSans, Montserrat, Avenir, Arial, sans-serif; font-weight: 700; }
  #stage { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; }
  .regel { position: absolute; left: 0; right: 0; text-align: center; color: #fff; white-space: nowrap;
           text-shadow: 0 4px 26px rgb(0 0 0 / .55); transition: transform 650ms cubic-bezier(.22,.8,.25,1), opacity 650ms ease, font-size 650ms ease; will-change: transform, opacity; }
  .regel .kern { font-style: italic; background: linear-gradient(90deg, #d8fff8, #7de8ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 16px rgb(110 230 255 / .6)); }
</style>
<div id="stage"></div>
<script>
// Doorrollende liedtekst: elke tekstregel is één blijvend element dat omhoog schuift (nieuw komt van onder, oud schuift weg en dimt).
// Bron: /api/public/lyrics-roll (de app vraagt de actieve regels aan FreeShow) of ?demo voor een testreeks zonder FreeShow. ?h=1080 zet de hoogte vast (FreeShow's webview meldt een te kleine hoogte).
const P = new URLSearchParams(location.search);
let HOOGTE, MIDDEN, STAP, GROOT, KLEIN;
function maten() { HOOGTE = +P.get('h') || innerHeight; MIDDEN = HOOGTE * .5; STAP = HOOGTE * .17; GROOT = HOOGTE * .095; KLEIN = HOOGTE * .058; }   // de webview in FreeShow wordt eerst klein aangemaakt en groeit daarna
maten(); addEventListener("resize", () => { maten(); indeling(); });
const KERN = /^(god|heer|jezus|halleluja|liefde|koning|geest|u)$/i;
const stage = document.getElementById("stage");
let blokken = [];  // per dia een blok regels; [-1] is de huidige. Elke regel is één blijvend element dat omhoog schuift
let laatste = null;

function maak(tekst) {
  const el = document.createElement("div"); el.className = "regel";
  el.innerHTML = tekst.split(" ").map(w => KERN.test(w.replace(/[^\p{L}]/gu, "")) ? `<span class="kern">${w}</span>` : w).join(" ");
  stage.appendChild(el); return el;
}
function stel(el, y, maat, dim) {
  el.style.fontSize = maat + "px"; el.style.top = (MIDDEN - maat / 2) + "px"; el.style.opacity = dim; el.style.transform = `translateY(${y}px)`;
}
function indeling() {   // huidig blok gecentreerd en helder; eerdere blokken er bovenaan, kleiner en steeds doffer
  let boven = null;
  for (let k = blokken.length - 1; k >= 0; k--) {
    const b = blokken[k], n = b.lijnen.length, ouderdom = blokken.length - 1 - k;
    const maat = ouderdom === 0 ? GROOT : KLEIN, gap = ouderdom === 0 ? STAP * 1.15 : STAP * .8, dim = ouderdom === 0 ? 1 : (ouderdom === 1 ? .38 : .14);
    let begin = ouderdom === 0 ? -(n - 1) / 2 * gap : boven - (n - 1) * gap - gap * 1.05;
    b.lijnen.forEach((el, i) => { if (el.dataset.w) return; if (ouderdom > 2) { el.style.opacity = 0; } else stel(el, begin + i * gap, maat, dim); b.y = begin; });
    boven = begin;
  }
  while (blokken.length > 4) blokken.shift().lijnen.forEach(el => setTimeout(() => el.remove(), 1000));
}
// modus=stream: voor de livestream-uitvoer, gewone liedtekst onderin (geen doorrol), zodat de zaaluitvoer en de stream beide uit dezelfde pagina komen
const STREAM = P.get("modus") === "stream";
let streamEl = null;
function toonStream(tekst) {
  maten(); const t = (tekst || "").split("\n").map(x => x.trim()).filter(Boolean);
  if (streamEl) { const oud = streamEl; oud.style.opacity = 0; setTimeout(() => oud.remove(), 400); streamEl = null; }
  if (!t.length) return;
  const el = document.createElement("div"); el.className = "regel"; el.style.cssText = `top:auto;bottom:${HOOGTE * .07}px;font-size:${HOOGTE * .052}px;line-height:1.3;opacity:0;transition:opacity 350ms ease;white-space:normal`;
  el.innerHTML = t.map(r => r.split(" ").map(w => KERN.test(w.replace(/[^\p{L}]/gu, "")) ? `<span class="kern">${w}</span>` : w).join(" ")).join("<br>");
  stage.appendChild(el); streamEl = el; void el.offsetWidth; el.style.opacity = 1;
}
function toon(tekst) {
  if (STREAM) { if (tekst !== laatste) { laatste = tekst; toonStream(tekst); } return; }
  maten();
  if (tekst === laatste) return; laatste = tekst;
  const t = (tekst || "").split("\n").map(x => x.trim()).filter(Boolean);
  if (!t.length) { blokken.forEach(b => b.lijnen.forEach(el => el.style.opacity = 0)); return; }
  const lijnen = t.map(maak);
  lijnen.forEach((el, i) => { el.dataset.w = 1; el.style.transition = "none"; stel(el, STAP * (3 + i), GROOT, 0); });   // nieuwe regels starten onderaan
  blokken.push({ lijnen }); void stage.offsetWidth;
  lijnen.forEach((el, i) => setTimeout(() => { delete el.dataset.w; el.style.transition = ""; indeling(); }, 20 + i * 160));
  setTimeout(indeling, 20);
}
// ontwikkelhulp: herlaadt zichzelf als dit bestand op de server verandert
let versie = null; setInterval(async () => { try { const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" }); const v = r.headers.get("last-modified"); if (versie && v !== versie) location.reload(); versie = v; } catch (e) {} }, 2000);
let versie2 = -1;
async function poll() {
  let wacht = 0;
  try {
    const r = await fetch(`/api/public/lyrics-roll?v=${versie2}`, { cache: "no-store" });
    const j = await r.json(); toon(j.text ?? "");
    if (typeof j.v === "number") versie2 = j.v; else wacht = 250;   // geen versie (proefserver): gewoon vaak vragen
    if (j.error) wacht = 1000;
  } catch (e) { wacht = 1000; }
  setTimeout(poll, wacht);
}
if (P.has("demo")) {
  const d = ["Heer U bent goed en Uw liefde\nen trouw zijn voor eeuwig", "Door heel de wereld\nen in elke taal", "Wij prijzen U Halleluja Halleluja\nWij prijzen U om wie U bent", "U bent goed"];
  let i = 0; (function volgende() { toon(d[i++ % d.length]); setTimeout(volgende, 4000); })();
} else poll();
</script>
