[package]
name = "ark-engine"
version = "0.1.0"
edition = "2021"
description = "De speler van Ark Tracks voor Windows en Linux (en straks overal): mixer, sprongen op de maat, tempokaart, cues. Voorproef M0/M1."

[lib]
name = "ark_engine"
path = "src/lib.rs"

[[bin]]
name = "ark-engine-cli"
path = "src/bin/cli.rs"

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
serde_json = "1"
hound = "3.5"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
flate2 = "1"
base64 = "0.22"
trash = "5"
rfd = { version = "0.15", optional = true, default-features = false, features = ["gtk3"] }
cpal = { version = "0.15", optional = true }
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
rubato = "0.16"
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
getrandom = "0.2"
if-addrs = "0.13"
qrcode = "0.14"
gethostname = "0.5"

time = "0.3"

[features]
default = []
audio = ["dep:cpal"]
app = ["audio", "dep:wry", "dep:tao", "dep:rfd"]

[[bin]]
name = "ark-engine-play"
path = "src/bin/play.rs"
required-features = ["audio"]

[[bin]]
name = "ark-tracks"
path = "src/bin/app.rs"
required-features = ["app"]

[profile.release]
opt-level = 3
lto = true
